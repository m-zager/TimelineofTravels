<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New trip · Timeline of Travels</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="trip-page">
    <a class="back-link" href="index.html">← Back to globe</a>
    <h1 id="page-title">New trip</h1>
    <p id="coords" class="coords muted"></p>

    <form id="trip-form" class="trip-form">
      <label class="field">
        <span>Trip name</span>
        <input name="name" required maxlength="120" placeholder="Summer in Lisbon" autocomplete="off">
      </label>

      <label class="field">
        <span>Place</span>
        <input name="place" maxlength="120" placeholder="Lisbon, Portugal" autocomplete="off">
      </label>

      <div class="field-row">
        <label class="field">
          <span>Month</span>
          <select name="month" required>
            <option value="">Select month</option>
          </select>
        </label>
        <label class="field">
          <span>Year</span>
          <select name="year" required>
            <option value="">Select year</option>
          </select>
        </label>
      </div>

      <fieldset class="photos">
        <legend>Photos</legend>
        <label id="dropzone" class="dropzone">
          <input id="photo-input" type="file" accept="image/*" multiple>
          <span>Drop photos here or <u>choose files</u></span>
        </label>
        <ul id="photo-grid" class="photo-grid"></ul>
      </fieldset>

      <p id="form-error" class="form-error" role="alert" hidden></p>

      <div class="actions">
        <button type="submit" id="save-btn" class="btn btn-primary">Save trip</button>
        <a href="index.html" class="btn">Cancel</a>
        <button type="button" id="delete-btn" class="btn btn-danger" hidden>Delete trip</button>
      </div>
    </form>

    <p class="storage-note muted small">Trips and photos are saved in this browser only.</p>
  </main>

  <dialog id="viewer" class="viewer">
    <img alt="">
    <form method="dialog">
      <button class="btn">Close</button>
    </form>
  </dialog>

  <script type="module" src="js/trip.js"></script>
</body>
</html>
